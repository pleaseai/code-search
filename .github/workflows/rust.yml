name: Rust

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - 'crates/**'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - .github/workflows/rust.yml
  # The `ignored-tests` job below is network-gated; run it manually or weekly so
  # the PR gate stays offline. See ADR-0004.
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The toolchain (and rustfmt/clippy components) is selected by
      # rust-toolchain.toml via the runner's preinstalled rustup.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # After the toolchain step: the cache key hashes the `rustc` on PATH.
      - name: Set up mbx cache
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: 1.29.2
          cache-generation: test-v1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: mbx clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: mbx test --all-features --locked --workspace

  ignored-tests:
    # Network-gated: these tests download tree-sitter grammars from GitHub
    # releases (see ADR-0004). Kept off the PR/push gate so it stays offline and
    # flake-free; runs on manual dispatch or the weekly schedule to catch
    # grammar-fetch / parser-compat regressions.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set up mbx cache
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: 1.29.2
          cache-generation: ignored-v1

      - name: Test (ignored / network-gated)
        run: mbx test --all-features --locked --workspace -- --ignored
